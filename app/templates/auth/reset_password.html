{% extends "base.html" %}

{% block title %}Reset password - JobLens{% endblock %}

{% block content %}
    <h2 class="text-center fw-bold mb-2 display-font">Choose a new password</h2>
    <p class="text-center text-muted mb-4">This also unlocks your account</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <div class="mb-3">
            <label for="new_password" class="form-label">New password</label>
            <input type="password" class="form-control" id="new_password" name="new_password"
                   pattern="[A-Z](?=.*[!@#$%^&amp;*(),.?&quot;:{}|&lt;&gt;]).{6,}"
                   title="Start with a capital letter, at least 7 characters, include a special character"
                   required>
            <div class="form-text" style="font-size: 0.75rem;">
                Starts with a capital letter, 7+ characters, includes a special character
            </div>
        </div>

        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm new password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Reset password</button>
    </form>
{% endblock %}
