{% extends "base.html" %}

{% block title %}Forgot password - JobLens{% endblock %}

{% block content %}
    <h2 class="text-center fw-bold mb-2 display-font">Forgot password</h2>
    <p class="text-center text-muted mb-4">Enter your account email. We will send a reset link to it.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" autocomplete="off">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Send reset link</button>
        <a href="{{ url_for('auth.login') }}" class="btn btn-google w-100 mt-2 text-decoration-none">Back to sign in</a>
    </form>
{% endblock %}
